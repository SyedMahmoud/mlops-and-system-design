name: Continuous Deployment - syed mahmoud

on:
  push:
    branches:
      - main  # Trigger on push to the `main` branch
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Ensure the workflow has permission to push commits
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Checkout code from repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute the main script
      - name: Execute the main script
        run: python session_4/main.py

      # Commit and push changes
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.github.com"
          git add session_4/models/
          git diff --staged --quiet || git commit -m "chore: generated new model"
          git push origin main
